name: Rebuild trading leaderboard

# Midnight Central European Time, year round.
# CET is UTC+1 in winter and UTC+2 in summer, so both hours are scheduled and
# the job simply does nothing when the data has not changed. That avoids
# chasing daylight saving in a cron expression.
on:
  schedule:
    - cron: '0 22 * * *'   # 00:00 CEST (summer)
    - cron: '0 23 * * *'   # 00:00 CET  (winter)
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch trades from Ethereum
        env:
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}
        run: node scripts/fetch-trades.mjs

      - name: Render the leaderboard page
        run: node scripts/build-leaderboard.mjs

      - name: Refresh DAO state
        env:
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}
        run: node scripts/fetch-dao.mjs && node scripts/build-dao.mjs

      - name: Commit only if the trade data actually changed
        run: |
          git config user.name  "DFV leaderboard bot"
          git config user.email "actions@users.noreply.github.com"

          # Only the CSVs are compared. index.html and trades.json both carry a
          # "generated at" timestamp that changes on every single run, so
          # including them here would mean committing and redeploying nightly
          # even when nobody has traded. The CSVs contain trade data and
          # nothing else, which makes them the honest signal.
          if git diff --quiet -- leaderboard/trades.csv leaderboard/leaderboard.csv \
             && git diff --quiet -I'"generatedAt"' -- dao/state.json; then
            echo "No new trades since the last run. Discarding the rebuild."
            git checkout -- leaderboard/ dao/
            exit 0
          fi

          git add leaderboard/ dao/
          git commit -m "chore: rebuild trading leaderboard $(date -u +%Y-%m-%d)"
          git push
          echo "Published updated leaderboard."
