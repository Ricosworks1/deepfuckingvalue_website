name: Rebuild trading leaderboard

# Midnight Central European Time, year round.
# CET is UTC+1 in winter and UTC+2 in summer, so both hours are scheduled and
# the job simply does nothing when the data has not changed. That avoids
# chasing daylight saving in a cron expression.
on:
  schedule:
    - cron: '0 22 * * *'   # 00:00 CEST (summer)
    - cron: '0 23 * * *'   # 00:00 CET  (winter)
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch trades from Ethereum
        env:
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}
        run: node scripts/fetch-trades.mjs

      - name: Render the leaderboard page
        run: node scripts/build-leaderboard.mjs

      - name: Commit only if something actually changed
        run: |
          git config user.name  "DFV leaderboard bot"
          git config user.email "actions@users.noreply.github.com"

          # index.html always contains a fresh "last rebuilt" timestamp, so it
          # is deliberately excluded from the change check — otherwise every
          # run would produce a commit and a redeploy for no reason.
          if git diff --quiet -- leaderboard/trades.json leaderboard/trades.csv leaderboard/leaderboard.csv; then
            echo "No new trades since the last run. Nothing to publish."
            exit 0
          fi

          git add leaderboard/
          git commit -m "chore: rebuild trading leaderboard $(date -u +%Y-%m-%d)"
          git push
          echo "Published updated leaderboard."
